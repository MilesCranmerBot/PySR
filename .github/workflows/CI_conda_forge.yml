name: conda-forge published-package canary

# Weekly smoke test for the latest published PySR package on conda-forge.

on:
  pull_request:
    branches:
      - 'master'
      - 'release-*'
    paths:
      - '.github/workflows/CI_conda_forge.yml'
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:
  conda_test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SCIPY_ARRAY_API: "1"
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']

    steps:
      - name: "Set up Conda"
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          auto-activate-base: true
          python-version: ${{ matrix.python-version }}
          activate-environment: pysr-test
      - name: "Set up Julia"
        uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: "Install pysr"
        run: |
          conda install -y pysr
          python -c 'import importlib.metadata, pysr; print("Installed PySR", importlib.metadata.version("pysr"))'
          echo "Finished."
      - name: "Run tests"
        run: |
          echo "Running tests"
          pip install pytest nbval
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pip install py-spy
            python - <<'PY'
          import shutil
          import subprocess
          import sys
          debugger = shutil.which("gdb")
          assert debugger, "Windows runner must provide gdb"
          child = subprocess.Popen([sys.executable, "-m", "pysr", "test", "main,startup"])
          print("Canary Python PID:", child.pid, flush=True)
          try:
              result = child.wait(timeout=1200)
          except subprocess.TimeoutExpired:
              for command in (
                  ["py-spy", "dump", "--pid", str(child.pid)],
                  [debugger, "--batch", "-ex", "set pagination off", "-ex", "thread apply all bt", "-ex", "detach", "-p", str(child.pid)],
              ):
                  print("Collecting stacks:", command, flush=True)
                  diagnostic = subprocess.run(command, timeout=120)
                  print("Diagnostic exit:", diagnostic.returncode, flush=True)
              result = child.wait()
          sys.exit(result)
          PY
          else
            python -m pysr test main,startup
          fi
          echo "Finished."
